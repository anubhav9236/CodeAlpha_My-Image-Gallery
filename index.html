<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Responsive Image Gallery created for CodeAlpha Frontend Development Internship">

    <title> My Image Gallery </title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-content">
      
            <p class="small-title">Welcome </p>
            
            <h1>My Image Gallery</h1>

            <p class="subtitle">
                Explore beautiful moments through my responsive image gallery.
            </p>

        </div>

    </header>


    <!-- ================= FILTER SECTION ================= -->

    <section class="filter-section">

        <div class="filter-container">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="nature">
                Nature
            </button>

            <button class="filter-btn" data-filter="animals">
                Animals
            </button>

            <button class="filter-btn" data-filter="travel">
                Travel
            </button>

        </div>

    </section>


    <!-- ================= GALLERY ================= -->

    <main class="gallery-container">

        <div class="gallery" id="gallery">


            <!-- Nature 1 -->

            <div class="gallery-item"
                 data-category="nature">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUQUP6uQzx81iIpxmbbWarl2h97NJdQxCuxaq4ByR_vQ&s"
                    alt="Beautiful mountain landscape"
                    loading="lazy"
                >

                <div class="image-info">
                    <h3>Manimahesh</h3>
                    <p>Nature</p>
                </div>

            </div>


            <!-- Nature 2 -->

            <div class="gallery-item"
                 data-category="nature">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9l7YmolaumFp8ohV3O9ejLnOKfKdapsF6UctXEUJu_w&s=10"
                    alt="Beautiful Scene"
                    loading="lazy"
                >

                <div class="image-info">
                    <h3>Manimahesh Kailash</h3>
                    <p>Nature</p>
                </div>

            </div>


            <!-- Nature 3 -->

            <div class="gallery-item"
                 data-category="nature">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGVb7qPSMSnpqIwKPFuZwIZNxc9vf_KwMHsYA6SbDFIw&s=10"
                    alt="Beautiful waterfall"
                    loading="lazy"
                >

                <div class="image-info">
                    <h3>Mountain View</h3>
                    <p>Nature</p>
                </div>

            </div>


            <!-- Animals 1 -->

            <div class="gallery-item"
                 data-category="animals">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQG9uXGEbOiqTYOLSHFY9pDOWhs-KMjEGVx3BaEpfhuGQ&s=10""
                    loading=""
                >

                <div class="image-info">
                    <h3>Panda</h3>
                    <p>Animal</p>
                </div>

            </div>


            <!-- Animals 2 -->

            <div class="gallery-item"
                 data-category="animals">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDxcFOybPFBtv4Xu-yPYuJoJjZXiraiCrhgxP9kBu6-A&s=10"
                    alt="Beautiful bird"
                    loading="lazy"
                >

                <div class="image-info">
                    <h3>Elephant</h3>
                    <p>Animals</p>
                </div>

            </div>


            <!-- Animals 3 -->

            <div class="gallery-item"
                 data-category="animals">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLmt-rS4Rainz-rsngxQ_8aT3vxADGV7TSzjaCYXhfnA&s"
                    loading="lazy"
                >

                <div class="image-info">
                    <h3>Tiger</h3>
                    <p>Animal</p>
                </div>

            </div>


            <!-- Travel 1 -->

            <div class="gallery-item"
                 data-category="travel">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAJe8xUzYdr1YMFpa64cIFGWtF2SqIimhhR77f7Rhn1oLyzQNPY1pCxgc&s"                    
                    alt=""
                    loading="lazy"
                >

                <div class="image-info">
                    <h3></h3>
                    <p>Travel</p>
                </div>

            </div>


            <!-- Travel 2 -->

            <div class="gallery-item"
                 data-category="travel">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTe3GpEArY2Zj_wcdXiXM0F_hmTrU84vHur9ig16vD4phkov5EfQ_ndpFI&s"
                    alt=""
                    loading="lazy"
                >

                <div class="image-info">
                    <h3></h3>
                    <p>Travel</p>
                </div>

            </div>


            <!-- Travel 3 -->

            <div class="gallery-item"
                 data-category="travel">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcGEWwC62WjJIvmGhZeEqFZJg3JLPvHb5L9ShYa5E05s0T6P7LVCKqCdU&s"
                    alt=""
                    loading="lazy"
                >

                <div class="image-info">
                    <h3></h3>
                    <p>Travel</p>
                </div>

            </div>

        </div>

    </main>


    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <!-- Close -->

        <button
            class="close-btn"
            id="closeBtn"
            aria-label="Close image viewer"
        >
            &times;
        </button>


        <!-- Previous -->

        <button
            class="nav-btn prev-btn"
            id="prevBtn"
            aria-label="Previous image"
        >
            &#10094;
        </button>


        <!-- Image Area -->

        <div class="lightbox-content">

            <img
                id="lightboxImage"
                src=""
                alt="Gallery image"
            >

            <div class="lightbox-caption">

                <h2 id="lightboxTitle"></h2>

                <p id="lightboxCategory"></p>

                <span id="imageCounter"></span>

            </div>

        </div>


        <!-- Next -->

        <button
            class="nav-btn next-btn"
            id="nextBtn"
            aria-label="Next image"
        >
            &#10095;
        </button>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 My Image Gallery
        </p>

        <p>
            Created by Anubhav--
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
